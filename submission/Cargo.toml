[package]
name = "non_crossing_matching_engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "non_crossing_matching_engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
csv = "1"
ahash = "0.8"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
serde = { version = "1.0.229", features = ["derive", "rc"] }
